name: Quality
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
env:
  APP_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-local-publishable-key
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  EXTERNAL_INTEGRATIONS_MODE: disabled
jobs:
  unit:
    runs-on: ubuntu-latest
    steps: &app-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:env-guard
      - run: npm test -- --maxWorkers=1
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:coverage:baseline -- --maxWorkers=1
      - run: npm run test:coverage -- --maxWorkers=1
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:foundation-types
      - run: npm run lint
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Start local Supabase database
        run: |
          set +e
          npx supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --debug 2>&1 | tee supabase-start.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -n 30 supabase-start.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Supabase local startup failed::$diagnostic"
            exit "$status"
          fi
      - name: Run database authorization tests
        run: |
          set +e
          npm run test:db 2>&1 | tee database-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -n 30 database-tests.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Database authorization tests failed::$diagnostic"
            exit "$status"
          fi
      - if: always()
        run: npx supabase stop --no-backup
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
